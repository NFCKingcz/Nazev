<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safecard</title>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --ink:#1C1610;
    --muted:#6B6259;
    --accent:#E8621A;
    --accent-soft:#FBE3D3;
    --border:#EFEAE3;
    --radius:24px;
    --font-display:"Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-display);
    font-weight:300;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  #confetti-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
  }
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:44px 32px 36px;
    text-align:center;
    box-shadow:0 1px 2px rgba(28,22,16,0.03), 0 16px 40px rgba(28,22,16,0.05);
  }
  .lang-switch{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:32px;
  }
  .lang-switch button{
    border:1.5px solid var(--border);
    background:var(--surface);
    font-family:var(--font-display);
    font-weight:500;
    font-size:13px;
    letter-spacing:0.01em;
    color:var(--ink);
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .lang-switch button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  h1{
    font-family:var(--font-display);
    font-weight:900;
    font-size:26px;
    line-height:1.25;
    letter-spacing:-0.01em;
    margin-bottom:14px;
  }
  .lead{
    font-size:15px;
    line-height:1.55;
    color:var(--muted);
    font-weight:400;
    margin-bottom:24px;
    padding:0 4px;
  }
  .call-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:18px 20px;
    background:var(--ink);
    color:#fff;
    text-decoration:none;
    border-radius:16px;
    font-family:var(--font-display);
    font-weight:500;
    font-size:18px;
    letter-spacing:0.01em;
    transition:transform 0.15s ease;
    box-shadow:0 10px 24px rgba(28,22,16,0.18);
  }
  .call-btn:active{transform:scale(0.97);}
  .call-btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:3px;}
  .claim{
    margin-top:22px;
    font-family:var(--font-display);
    font-weight:300;
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.01em;
  }
  .divider{
    height:1px;
    background:var(--border);
    margin:28px 0 20px;
  }
  .fallback-label{
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    margin-bottom:12px;
  }
  .fallback-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:13px 18px;
    background:transparent;
    color:var(--ink);
    text-decoration:none;
    border-radius:14px;
    border:1.5px solid var(--border);
    font-family:var(--font-display);
    font-weight:400;
    font-size:14px;
  }
  .fallback-btn:active{background:#FAFAF9;}
  .footer{
    margin-top:28px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .footer img{
    height:22px;
    width:auto;
  }
  @media (max-width:360px){
    .card{padding:36px 22px 28px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="card">
    <div class="lang-switch" role="group" aria-label="Jazyk / Language">
      <button type="button" id="lang-cs" class="active" aria-pressed="true">Čeština</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
      <button type="button" id="lang-de" aria-pressed="false">Deutsch</button>
      <button type="button" id="lang-fr" aria-pressed="false">Français</button>
      <button type="button" id="lang-es" aria-pressed="false">Español</button>
      <button type="button" id="lang-pl" aria-pressed="false">Polski</button>
    </div>

    <h1 id="title-text">Možná mě někdo postrádá.</h1>
    <p class="lead" id="lead-text">Prosím, zavolej.</p>

      </svg>
      <span id="call-text">Zavolat</span>

    <div class="divider"></div>

      fallbackBtn: 'Call emergency line 112'
    },
    de: {
      title: 'Vielleicht vermisst mich jemand.',
      lead: 'Bitte ruf an.',
      callPrefix: 'Anrufen ',
      noContact: 'Kontakt noch nicht festgelegt',
      claim: 'Danke, dass du hilfst.',
      fallbackLabel: 'Sieht das ernst aus?',
      fallbackBtn: 'Notruf 112 anrufen'
    },
    fr: {
      title: "Quelqu'un me cherche peut-être.",
      lead: "S'il te plaît, appelle.",
      callPrefix: 'Appeler ',
      noContact: 'Contact non renseigné',
      claim: "Merci de ton aide.",
      fallbackLabel: "Est-ce que ça semble grave ?",
      fallbackBtn: "Appeler le 112"
    },
    es: {
      title: 'Puede que alguien me eche de menos.',
      lead: 'Por favor, llama.',
      callPrefix: 'Llamar ',
      noContact: 'Contacto aún no configurado',
      claim: 'Gracias por ayudar.',
      fallbackLabel: '¿Parece grave?',
      fallbackBtn: 'Llamar al 112'
    },
    pl: {
      title: 'Może ktoś za mną tęskni.',
      lead: 'Proszę, zadzwoń.',
      callPrefix: 'Zadzwoń ',
      noContact: 'Kontakt jeszcze nie ustawiony',
      claim: 'Dzięki, że pomagasz.',
      fallbackLabel: 'Wygląda to poważnie?',
      fallbackBtn: 'Zadzwoń na 112'
    }
  };

  const langCodes = ['cs', 'en', 'de', 'fr', 'es', 'pl'];

  const params = new URLSearchParams(window.location.search);

  // Ochrana proti dvojitému zakódování URL
  function safeDecode(value) {
    if (!value) return value;
    let result = value;
    let attempts = 0;
    while (/%[0-9A-Fa-f]{2}/.test(result) && attempts < 3) {
      try {
        const decoded = decodeURIComponent(result);
        if (decoded === result) break;
        result = decoded;
      } catch (e) {
        break;
      }
      attempts++;
    }
    return result;
  }

  const tel = safeDecode(params.get('tel'));

  const callLink = document.getElementById('call-link');
  const callText = document.getElementById('call-text');

  if (tel) {
    callLink.href = 'tel:' + tel;
  } else {
    callLink.removeAttribute('href');
    callLink.style.pointerEvents = 'none';
  }

  function applyLanguage(lang) {
    const t = translations[lang] || translations.cs;

    document.getElementById('title-text').textContent = t.title;
    document.getElementById('lead-text').textContent = t.lead;
    document.getElementById('claim-text').textContent = t.claim;
    document.getElementById('fallback-label-text').textContent = t.fallbackLabel;
    document.getElementById('fallback-btn-text').textContent = t.fallbackBtn;
    callText.textContent = tel ? t.callPrefix + tel : t.noContact;

    document.documentElement.lang = lang;

    langCodes.forEach(code => {
      const btn = document.getElementById('lang-' + code);
      const isActive = code === lang;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', isActive);
    });
  }

  langCodes.forEach(code => {
    document.getElementById('lang-' + code)
      .addEventListener('click', () => applyLanguage(code));
  });

  const jazykParam = params.get('jazyk');

  function detectBrowserLang() {
    const browserLangs = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || 'cs'];

    for (const bl of browserLangs) {
      const code = bl.toLowerCase().split('-')[0];
      if (langCodes.includes(code)) return code;
    }
    return 'cs';
  }

  const initialLang = langCodes.includes(jazykParam) ? jazykParam : detectBrowserLang();
  applyLanguage(initialLang);

  // --- Konfety při načtení stránky, výrazný barevný "burst" ---
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduceMotion) {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const colors = [
      '#FF3B5C', '#FF9F1C', '#FFD400', '#2EC4B6',
      '#1E88E5', '#8E5BF0', '#FF5DA2', '#00C853',
      '#FF6B35', '#4CC9F0'
    ];
    const count = 160;
    const pieces = [];
    const gravity = 0.16;
    const originX = w / 2;
    const originY = h * 0.32;

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const power = 6 + Math.random() * 11;
      pieces.push({
        x: originX,
        y: originY,
        size: 6 + Math.random() * 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: Math.cos(angle) * power,
        vy: Math.sin(angle) * power - 4,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 18,
        shape: Math.random() > 0.4 ? 'rect' : 'circle',
        drag: 0.985
      });
    }

    let elapsed = 0;
    const duration = 3200;
    let lastTime = null;

    function frame(time) {
      if (lastTime === null) lastTime = time;
      const dt = time - lastTime;
      lastTime = time;
      elapsed += dt;

      ctx.clearRect(0, 0, w, h);

      const fadeStart = duration - 600;
      const opacity = elapsed > fadeStart
        ? Math.max(0, 1 - (elapsed - fadeStart) / 600)
        : 1;

      pieces.forEach(p => {
        p.vy += gravity;
        p.vx *= p.drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      if (elapsed < duration) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
        canvas.style.display = 'none';
      }
    }

    requestAnimationFrame(frame);
  }
</script>

</body>
