<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nalezeno</title>
<style>
  :root{
    --bg:#FBF8F4;
    --surface:#FFFFFF;
    --ink:#1C1610;
    --muted:#6B6259;
    --accent:#E8621A;
    --accent-soft:#FBE3D3;
    --border:#EFE8DE;
    --radius:24px;
    --font-display:"Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-display);
    font-weight:300;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  #confetti-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
  }
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:var(--radius);
    padding:40px 28px 32px;
    text-align:center;
    box-shadow:0 1px 2px rgba(28,22,16,0.04), 0 12px 32px rgba(28,22,16,0.07);
  }
  .lang-switch{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:26px;
  }
  .lang-switch button{
    border:1.5px solid var(--border);
    background:var(--surface);
    font-family:var(--font-display);
    font-weight:500;
    letter-spacing:0.01em;
    color:var(--ink);
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .lang-switch button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  h1{
    font-family:var(--font-display);
    font-weight:900;
    font-size:28px;
    line-height:1.2;
    letter-spacing:-0.01em;
    margin-bottom:20px;
  }
  h1 #jmeno-text{color:var(--accent);}
  .lead{
    font-size:15px;
    line-height:1.55;
    color:var(--muted);
    margin-bottom:20px;
    padding:0 6px;
  }
  .call-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:18px 20px;
    background:var(--ink);
    color:#fff;
    text-decoration:none;
    border-radius:16px;
    font-family:var(--font-display);
    font-weight:500;
    font-size:18px;
    letter-spacing:0.01em;
    transition:transform 0.15s ease;
    box-shadow:0 10px 24px rgba(28,22,16,0.25);
  }
  .call-btn:active{transform:scale(0.97);}
  .call-btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:3px;}
  .claim{
    margin-top:20px;
    font-family:var(--font-display);
    font-weight:300;
    font-size:14px;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .divider{
    height:1px;
    background:var(--border);
    margin:26px 0 18px;
  }
  .fallback-label{
    font-size:13px;
    color:var(--muted);
    margin-bottom:12px;
  }
  .fallback-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:13px 18px;
    background:transparent;
    color:var(--ink);
    text-decoration:none;
    border-radius:14px;
    border:1.5px solid var(--border);
    font-family:var(--font-display);
    font-weight:400;
    font-size:14px;
  }
  .fallback-btn:active{background:var(--bg);}
  .footer{
    margin-top:26px;
    font-family:var(--font-display);
    font-weight:300;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--muted);
  }
  @media (max-width:360px){
    .card{padding:32px 20px 26px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="card">
    <div class="lang-switch" role="group" aria-label="Jazyk / Language">
      <button type="button" id="lang-cs" class="active" aria-pressed="true">Čeština</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
      <button type="button" id="lang-de" aria-pressed="false">Deutsch</button>
      <button type="button" id="lang-fr" aria-pressed="false">Français</button>
      <button type="button" id="lang-es" aria-pressed="false">Español</button>
      <button type="button" id="lang-pl" aria-pressed="false">Polski</button>
    </div>

    <h1><span id="greeting-text">Ahoj, jsem</span> <span id="jmeno-text">někdo</span>.</h1>
    <p class="lead" id="lead-text">
      Ztratil/a jsem se. Prosím, pomozte mi,
      stačí jedno zavolání.
    </p>

    <a id="call-link" class="call-btn" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.6 10.8C8 13.6 10.4 16 13.2 17.4L15.4 15.2C15.7 14.9 16.1 14.8 16.5 15C17.8 15.4 19.1 15.6 20.5 15.6C21.1 15.6 21.5 16 21.5 16.6V20.5C21.5 21.1 21.1 21.5 20.5 21.5C10.8 21.5 3 13.7 3 4C3 3.4 3.4 3 4 3H7.9C8.5 3 8.9 3.4 8.9 4C8.9 5.4 9.1 6.7 9.5 8C9.6 8.4 9.5 8.8 9.3 9.1L7.1 11.3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="call-text">Zavolat</span>
    </a>

    <p class="claim" id="claim-text">Každá minuta se počítá.</p>

    <div class="divider"></div>

    <p class="fallback-label" id="fallback-label-text">Nejde se dovolat?</p>
    <a class="fallback-btn" href="tel:112" id="fallback-btn-text">Zavolat linku 112</a>

    <div class="footer">nfcking</div>
  </div>

<script>
  // --- Překlady ---
  const translations = {
    cs: {
      greeting: 'Ahoj, jsem',
      lead: 'Ztratil/a jsem se. Prosím, pomoz mi, stačí jedno zavolání.',
      callPrefix: 'Zavolat ',
      noContact: 'Kontakt zatím nenastaven',
      claim: 'Každá minuta se počítá.',
      fallbackLabel: 'Nejde se dovolat?',
      fallbackBtn: 'Zavolat linku 112'
    },
    en: {
      greeting: "Hi, I'm",
      lead: "I got lost. Please help me, just one phone call.",
      callPrefix: 'Call ',
      noContact: 'Contact not set yet',
      claim: 'Every minute counts.',
      fallbackLabel: "Can't get through?",
      fallbackBtn: 'Call emergency line 112'
    },
    de: {
      greeting: 'Hallo, ich bin',
      lead: 'Ich habe mich verirrt. Bitte hilf mir, ein Anruf genügt.',
      callPrefix: 'Anrufen ',
      noContact: 'Kontakt noch nicht festgelegt',
      claim: 'Jede Minute zählt.',
      fallbackLabel: 'Erreichst du niemanden?',
      fallbackBtn: 'Notruf 112 anrufen'
    },
    fr: {
      greeting: 'Bonjour, je suis',
      lead: "Je me suis perdu(e). Aide-moi, un simple appel suffit.",
      callPrefix: 'Appeler ',
      noContact: 'Contact non renseigné',
      claim: 'Chaque minute compte.',
      fallbackLabel: "Impossible de joindre ?",
      fallbackBtn: "Appeler le 112"
    },
    es: {
      greeting: 'Hola, soy',
      lead: 'Me he perdido. Por favor, ayúdame, basta con una llamada.',
      callPrefix: 'Llamar ',
      noContact: 'Contacto aún no configurado',
      claim: 'Cada minuto cuenta.',
      fallbackLabel: '¿No consigues contactar?',
      fallbackBtn: 'Llamar al 112'
    },
    pl: {
      greeting: 'Cześć, jestem',
      lead: 'Zgubiłem/am się. Proszę, pomóż mi, wystarczy jeden telefon.',
      callPrefix: 'Zadzwoń ',
      noContact: 'Kontakt jeszcze nie ustawiony',
      claim: 'Liczy się każda minuta.',
      fallbackLabel: 'Nie możesz się dodzwonić?',
      fallbackBtn: 'Zadzwoń na 112'
    }
  };

  const langCodes = ['cs', 'en', 'de', 'fr', 'es', 'pl'];

  const params = new URLSearchParams(window.location.search);
  const tel = params.get('tel');
  const jmeno = params.get('jmeno');

  if (jmeno) {
    document.getElementById('jmeno-text').textContent = jmeno;
  }

  const callLink = document.getElementById('call-link');
  const callText = document.getElementById('call-text');

  if (tel) {
    callLink.href = 'tel:' + tel;
  } else {
    callLink.removeAttribute('href');
    callLink.style.pointerEvents = 'none';
  }

  function applyLanguage(lang) {
    const t = translations[lang] || translations.cs;

    document.getElementById('greeting-text').textContent = t.greeting;
    document.getElementById('lead-text').textContent = t.lead;
    document.getElementById('claim-text').textContent = t.claim;
    document.getElementById('fallback-label-text').textContent = t.fallbackLabel;
    document.getElementById('fallback-btn-text').textContent = t.fallbackBtn;
    callText.textContent = tel ? t.callPrefix + tel : t.noContact;

    document.documentElement.lang = lang;

    langCodes.forEach(code => {
      const btn = document.getElementById('lang-' + code);
      const isActive = code === lang;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', isActive);
    });
  }

  langCodes.forEach(code => {
    document.getElementById('lang-' + code)
      .addEventListener('click', () => applyLanguage(code));
  });

  const jazykParam = params.get('jazyk');

  function detectBrowserLang() {
    const browserLangs = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || 'cs'];

    for (const bl of browserLangs) {
      const code = bl.toLowerCase().split('-')[0];
      if (langCodes.includes(code)) return code;
    }
    return 'cs';
  }

  const initialLang = langCodes.includes(jazykParam) ? jazykParam : detectBrowserLang();
  applyLanguage(initialLang);

  // --- Konfety při načtení stránky, výrazný barevný "burst" ---
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduceMotion) {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // hodně sytých, různorodých barev, ne barvy stránky
    const colors = [
      '#FF3B5C', '#FF9F1C', '#FFD400', '#2EC4B6',
      '#1E88E5', '#8E5BF0', '#FF5DA2', '#00C853',
      '#FF6B35', '#4CC9F0'
    ];
    const count = 160;
    const pieces = [];
    const gravity = 0.16;
    const originX = w / 2;
    const originY = h * 0.32;

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const power = 6 + Math.random() * 11;
      pieces.push({
        x: originX,
        y: originY,
        size: 6 + Math.random() * 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: Math.cos(angle) * power,
        vy: Math.sin(angle) * power - 4,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 18,
        shape: Math.random() > 0.4 ? 'rect' : 'circle',
        drag: 0.985
      });
    }

    let elapsed = 0;
    const duration = 3200;
    let lastTime = null;

    function frame(time) {
      if (lastTime === null) lastTime = time;
      const dt = time - lastTime;
      lastTime = time;
      elapsed += dt;

      ctx.clearRect(0, 0, w, h);

      const fadeStart = duration - 600;
      const opacity = elapsed > fadeStart
        ? Math.max(0, 1 - (elapsed - fadeStart) / 600)
        : 1;

      pieces.forEach(p => {
        p.vy += gravity;
        p.vx *= p.drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      if (elapsed < duration) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
        canvas.style.display = 'none';
      }
    }

    requestAnimationFrame(frame);
  }
</script>

</body>
</html>
