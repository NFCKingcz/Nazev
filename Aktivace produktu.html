<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktivace produktu</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1C1610; --muted:#6B6259;
    --accent:#E8621A; --accent-soft:#FBE3D3; --border:#EFEAE3; --radius:24px;
    --font-display:"Helvetica Neue", Helvetica, Arial, sans-serif;
    --ok-bg:#E4F3E8; --ok-ink:#1F5C33; --err-bg:#FBE3D3; --err-ink:#8C3A10;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-display); background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:420px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:40px 30px 34px; box-shadow:0 1px 2px rgba(28,22,16,0.03), 0 16px 40px rgba(28,22,16,0.05);
  }
  h1{font-weight:900; font-size:22px; margin-bottom:8px; letter-spacing:-0.01em;}
  .sub{font-size:14px; color:var(--muted); margin-bottom:28px; line-height:1.5;}
  label{display:block; font-size:13px; font-weight:600; margin:16px 0 6px;}
  input{
    width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:12px;
    background:#FAFAF9; font-size:15px; font-family:inherit;
  }
  input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .hint{font-size:11px; color:var(--muted); margin-top:5px;}
  .btn{
    width:100%; margin-top:22px; background:var(--ink); color:#fff; border:none;
    padding:15px 20px; border-radius:14px; font-size:16px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .status{margin-top:16px; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.5; display:none;}
  .status.show{display:block;}
  .status.ok{background:var(--ok-bg); color:var(--ok-ink);}
  .status.err{background:var(--err-bg); color:var(--err-ink);}
  .spinner{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff; display:inline-block; vertical-align:middle; margin-right:8px;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .success-view{display:none; text-align:center;}
  .success-view.show{display:block;}
  .success-view h1{margin-top:8px;}
  .form-view.hide{display:none;}
</style>
</head>
<body>
  <div class="card">

    <div class="form-view" id="formView">
      <h1>Aktivace produktu</h1>
      <p class="sub">Zadej sériové číslo z obalu a telefon, na který se mají obracet lidé, když tě/tvého blízkého najdou.</p>

      <label for="idInput">Sériové číslo</label>
      <input type="text" id="idInput" placeholder="např. 00042" autocomplete="off">
      <p class="hint">Najdeš ho na obalu nebo přímo na výrobku.</p>

      <label for="telInput">Telefonní číslo</label>
      <input type="tel" id="telInput" placeholder="+420777123456" autocomplete="tel">
      <p class="hint">Piš i s předvolbou, např. +420777123456.</p>

      <button class="btn" id="submitBtn" type="button">Aktivovat</button>

      <div class="status" id="statusBox"></div>
    </div>

    <div class="success-view" id="successView">
      <h1>Hotovo!</h1>
      <p class="sub">Tvůj produkt je aktivní. Kdykoliv budeš chtít telefon změnit, napiš nám.</p>
    </div>

  </div>

<script>
  // Sem vlož URL svého nasazeného Google Apps Script Web Appu (viz návod)
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwaPLTiz8qOqi8Anx9mPSs5_etTneNDRXvjCybp2_1Z4b9huqGr0XYS8e_KpEDPsp7M/exec';

  var idInput = document.getElementById('idInput');
  var telInput = document.getElementById('telInput');
  var submitBtn = document.getElementById('submitBtn');
  var statusBox = document.getElementById('statusBox');
  var formView = document.getElementById('formView');
  var successView = document.getElementById('successView');

  function showStatus(msg, ok) {
    statusBox.textContent = msg;
    statusBox.className = 'status show ' + (ok ? 'ok' : 'err');
  }

  submitBtn.addEventListener('click', function () {
    var id = idInput.value.trim();
    var tel = telInput.value.trim();

    if (!id) { showStatus('Zadej prosím sériové číslo.', false); return; }
    if (!tel) { showStatus('Zadej prosím telefonní číslo.', false); return; }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Aktivuji...';
    statusBox.className = 'status';

    var body = new URLSearchParams();
    body.append('id', id);
    body.append('tel', tel);

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: body
    })
      .then(function (res) { return res.text(); })
      .then(function (text) {
        var data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('Neplatná odpověď serveru.');
        }

        if (data.success) {
          formView.classList.add('hide');
          successView.classList.add('show');
        } else {
          var messages = {
            already_activated: 'Tohle sériové číslo je už aktivované. Pokud si myslíš, že jde o omyl, napiš nám.',
            id_not_found: 'Tohle sériové číslo v systému neexistuje. Zkontroluj, jestli jsi ho opsal/a správně.',
            missing_id: 'Zadej prosím sériové číslo.',
            missing_tel: 'Zadej prosím telefonní číslo.'
          };
          showStatus(messages[data.error] || data.message || 'Něco se nepovedlo, zkus to prosím znovu.', false);
        }
      })
      .catch(function (err) {
        showStatus('Nepodařilo se spojit se serverem. Zkontroluj připojení a zkus to znovu.', false);
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Aktivovat';
      });
  });
</script>
</body>
</html>
